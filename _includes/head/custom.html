{% if page.schema_type == "ProfilePage" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": "{{ site.url }}",
  "name": "Sagnik Bhadury — Bayesian Biostatistician",
  "description": {{ page.description | jsonify }},
  "mainEntity": {
    "@type": "Person",
    "@id": "{{ site.url }}#person",
    "name": "Sagnik Bhadury",
    "jobTitle": "Research Associate",
    "description": "Bayesian biostatistician developing methods for clinical trials, biomedical phenotyping, graphical models, and high-dimensional spatial data.",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/images/PORTRAIT.jpg",
    "email": "mailto:bhadury@umich.edu",
    "affiliation": {
      "@type": "Organization",
      "name": "University of Pennsylvania",
      "department": "Department of Biostatistics, Epidemiology and Informatics",
      "url": "https://www.upenn.edu/"
    },
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "University of Louisville",
      "url": "https://louisville.edu/"
    },
    "knowsAbout": [
      "Bayesian biostatistics",
      "Bayesian clinical trial design",
      "Early-phase clinical trials",
      "Biomedical phenotyping",
      "ARDS",
      "Pneumonia",
      "Sepsis",
      "Molecular cohort studies",
      "Gaussian graphical models",
      "High-dimensional statistics",
      "Horseshoe priors",
      "Spatial statistics",
      "Spatial transcriptomics",
      "Multiplexed tissue imaging",
      "Tumor microenvironment",
      "Computational pathology",
      "Multimodal data integration",
      "Cancer genomics",
      "Causal inference",
      "Functional data analysis",
      "Radiomics"
    ],
    "sameAs": {{ site.social.links | jsonify }}
  }
}
</script>
{% endif %}
